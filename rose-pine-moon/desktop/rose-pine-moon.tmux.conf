# Rain Rosé Pine Moon for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#2A273F,fg=#9894B1"
set -gq status-left-style "bg=#C4A7E7,fg=#232136,bold"
set -gq status-right-style "bg=#393552,fg=#E0DEF4"
set -gq window-status-style "fg=#6E6A86"
set -gq window-status-current-style "bg=#232136,fg=#C4A7E7,bold"
set -gq window-status-last-style "fg=#9894B1"
set -gq window-status-activity-style "fg=#F6C177"
set -gq window-status-bell-style "fg=#EB6F92,bold"
set -gq pane-border-style "fg=#44415A"
set -gq pane-active-border-style "fg=#C4A7E7"
set -gq message-style "bg=#393552,fg=#E0DEF4"
set -gq message-command-style "bg=#393552,fg=#C4A7E7"
set -gq mode-style "bg=#44415A,fg=#E0DEF4"
set -gq copy-mode-match-style "bg=#776150,fg=#E0DEF4"
set -gq copy-mode-current-match-style "bg=#F6C177,fg=#232136"
set -gq copy-mode-mark-style "bg=#536777,fg=#E0DEF4"
set -gq popup-style "bg=#393552,fg=#E0DEF4"
set -gq popup-border-style "fg=#C4A7E7"
set -gq menu-style "bg=#393552,fg=#E0DEF4"
set -gq menu-selected-style "bg=#C4A7E7,fg=#232136"
set -gq menu-border-style "fg=#44415A"
set -gq display-panes-colour "#6E6A86"
set -gq display-panes-active-colour "#C4A7E7"
set -gq clock-mode-colour "#C4A7E7"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#C4A7E7"
set -g @rain_accent_bright "#CFBDEC"
set -g @rain_on_accent "#232136"
set -g @rain_bg "#232136"
set -g @rain_panel "#2A273F"
set -g @rain_raised "#393552"
set -g @rain_border "#44415A"
set -g @rain_text "#E0DEF4"
set -g @rain_text_secondary "#9894B1"
set -g @rain_muted "#6E6A86"
set -g @rain_link "#9CCFD8"
set -g @rain_positive "#3E8FB0"
set -g @rain_warning "#F6C177"
set -g @rain_danger "#EB6F92"
set -g @rain_comment "#908CAA"
set -g @rain_palette "Rosé Pine Moon"
