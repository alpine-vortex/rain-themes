# Rain Nord Frost for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#3B4252,fg=#AEB5C3"
set -gq status-left-style "bg=#88C0D0,fg=#2E3440,bold"
set -gq status-right-style "bg=#434C5E,fg=#D8DEE9"
set -gq window-status-style "fg=#8B93A3"
set -gq window-status-current-style "bg=#2E3440,fg=#88C0D0,bold"
set -gq window-status-last-style "fg=#AEB5C3"
set -gq window-status-activity-style "fg=#EBCB8B"
set -gq window-status-bell-style "fg=#CA848C,bold"
set -gq pane-border-style "fg=#4C566A"
set -gq pane-active-border-style "fg=#88C0D0"
set -gq message-style "bg=#434C5E,fg=#D8DEE9"
set -gq message-command-style "bg=#434C5E,fg=#88C0D0"
set -gq mode-style "bg=#4C566A,fg=#D8DEE9"
set -gq copy-mode-match-style "bg=#7A705E,fg=#D8DEE9"
set -gq copy-mode-current-match-style "bg=#EBCB8B,fg=#2E3440"
set -gq copy-mode-mark-style "bg=#4F6074,fg=#D8DEE9"
set -gq popup-style "bg=#434C5E,fg=#D8DEE9"
set -gq popup-border-style "fg=#88C0D0"
set -gq menu-style "bg=#434C5E,fg=#D8DEE9"
set -gq menu-selected-style "bg=#88C0D0,fg=#2E3440"
set -gq menu-border-style "fg=#4C566A"
set -gq display-panes-colour "#8B93A3"
set -gq display-panes-active-colour "#88C0D0"
set -gq clock-mode-colour "#88C0D0"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#88C0D0"
set -g @rain_accent_bright "#ABD0DD"
set -g @rain_on_accent "#2E3440"
set -g @rain_bg "#2E3440"
set -g @rain_panel "#3B4252"
set -g @rain_raised "#434C5E"
set -g @rain_border "#4C566A"
set -g @rain_text "#D8DEE9"
set -g @rain_text_secondary "#AEB5C3"
set -g @rain_muted "#8B93A3"
set -g @rain_link "#81A1C1"
set -g @rain_positive "#A3BE8C"
set -g @rain_warning "#EBCB8B"
set -g @rain_danger "#CA848C"
set -g @rain_comment "#616E88"
set -g @rain_palette "Nord Frost"
