# Rain Kanagawa Dragon for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#12120F,fg=#A6A69C"
set -gq status-left-style "bg=#8BA4B0,fg=#0D0C0C,bold"
set -gq status-right-style "bg=#282727,fg=#C5C9C5"
set -gq window-status-style "fg=#737C73"
set -gq window-status-current-style "bg=#181616,fg=#8BA4B0,bold"
set -gq window-status-last-style "fg=#A6A69C"
set -gq window-status-activity-style "fg=#FF9E3B"
set -gq window-status-bell-style "fg=#E82424,bold"
set -gq pane-border-style "fg=#393836"
set -gq pane-active-border-style "fg=#8BA4B0"
set -gq message-style "bg=#282727,fg=#C5C9C5"
set -gq message-command-style "bg=#282727,fg=#8BA4B0"
set -gq mode-style "bg=#2D4F67,fg=#C5C9C5"
set -gq copy-mode-match-style "bg=#744C25,fg=#C5C9C5"
set -gq copy-mode-current-match-style "bg=#FF9E3B,fg=#181616"
set -gq copy-mode-mark-style "bg=#4A4D56,fg=#C5C9C5"
set -gq popup-style "bg=#282727,fg=#C5C9C5"
set -gq popup-border-style "fg=#8BA4B0"
set -gq menu-style "bg=#282727,fg=#C5C9C5"
set -gq menu-selected-style "bg=#8BA4B0,fg=#0D0C0C"
set -gq menu-border-style "fg=#393836"
set -gq display-panes-colour "#737C73"
set -gq display-panes-active-colour "#8BA4B0"
set -gq clock-mode-colour "#8BA4B0"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#8BA4B0"
set -g @rain_accent_bright "#A2B3B8"
set -g @rain_on_accent "#0D0C0C"
set -g @rain_bg "#181616"
set -g @rain_panel "#12120F"
set -g @rain_raised "#282727"
set -g @rain_border "#393836"
set -g @rain_text "#C5C9C5"
set -g @rain_text_secondary "#A6A69C"
set -g @rain_muted "#737C73"
set -g @rain_link "#949FB5"
set -g @rain_positive "#98BB6C"
set -g @rain_warning "#FF9E3B"
set -g @rain_danger "#E82424"
set -g @rain_comment "#737C73"
set -g @rain_palette "Kanagawa Dragon"
