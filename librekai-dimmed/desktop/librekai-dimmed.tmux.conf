# Rain Librekai Dimmed for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#272727,fg=#B0B0B0"
set -gq status-left-style "bg=#E58520,fg=#1E1E1E,bold"
set -gq status-right-style "bg=#404040,fg=#C5C8C6"
set -gq window-status-style "fg=#9A9B99"
set -gq window-status-current-style "bg=#1E1E1E,fg=#E58520,bold"
set -gq window-status-last-style "fg=#B0B0B0"
set -gq window-status-activity-style "fg=#D0B344"
set -gq window-status-bell-style "fg=#F44747,bold"
set -gq pane-border-style "fg=#505050"
set -gq pane-active-border-style "fg=#E58520"
set -gq message-style "bg=#404040,fg=#C5C8C6"
set -gq message-command-style "bg=#404040,fg=#E58520"
set -gq mode-style "bg=#434448,fg=#C5C8C6"
set -gq copy-mode-match-style "bg=#655A2D,fg=#C5C8C6"
set -gq copy-mode-current-match-style "bg=#D0B344,fg=#1E1E1E"
set -gq copy-mode-mark-style "bg=#3B4E6E,fg=#C5C8C6"
set -gq popup-style "bg=#404040,fg=#C5C8C6"
set -gq popup-border-style "fg=#E58520"
set -gq menu-style "bg=#404040,fg=#C5C8C6"
set -gq menu-selected-style "bg=#E58520,fg=#1E1E1E"
set -gq menu-border-style "fg=#505050"
set -gq display-panes-colour "#9A9B99"
set -gq display-panes-active-colour "#E58520"
set -gq clock-mode-colour "#E58520"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#E58520"
set -g @rain_accent_bright "#DA9C5A"
set -g @rain_on_accent "#1E1E1E"
set -g @rain_bg "#1E1E1E"
set -g @rain_panel "#272727"
set -g @rain_raised "#404040"
set -g @rain_border "#505050"
set -g @rain_text "#C5C8C6"
set -g @rain_text_secondary "#B0B0B0"
set -g @rain_muted "#9A9B99"
set -g @rain_link "#6796E6"
set -g @rain_positive "#9AA83A"
set -g @rain_warning "#D0B344"
set -g @rain_danger "#F44747"
set -g @rain_comment "#9A9B99"
set -g @rain_palette "Librekai Dimmed"
