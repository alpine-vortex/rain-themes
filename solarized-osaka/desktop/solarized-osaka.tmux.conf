# Rain Solarized Osaka for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#002C38,fg=#839395"
set -gq status-left-style "bg=#268BD3,fg=#001419,bold"
set -gq status-right-style "bg=#002C38,fg=#9EABAC"
set -gq window-status-style "fg=#637981"
set -gq window-status-current-style "bg=#001419,fg=#268BD3,bold"
set -gq window-status-last-style "fg=#839395"
set -gq window-status-activity-style "fg=#B28500"
set -gq window-status-bell-style "fg=#F55350,bold"
set -gq pane-border-style "fg=#063540"
set -gq pane-active-border-style "fg=#268BD3"
set -gq message-style "bg=#002C38,fg=#9EABAC"
set -gq message-command-style "bg=#002C38,fg=#268BD3"
set -gq mode-style "bg=#002C38,fg=#839395"
set -gq copy-mode-match-style "bg=#47410F,fg=#839395"
set -gq copy-mode-current-match-style "bg=#B28500,fg=#001419"
set -gq copy-mode-mark-style "bg=#104D4C,fg=#839395"
set -gq popup-style "bg=#002C38,fg=#9EABAC"
set -gq popup-border-style "fg=#268BD3"
set -gq menu-style "bg=#002C38,fg=#9EABAC"
set -gq menu-selected-style "bg=#268BD3,fg=#001419"
set -gq menu-border-style "fg=#063540"
set -gq display-panes-colour "#637981"
set -gq display-panes-active-colour "#268BD3"
set -gq clock-mode-colour "#268BD3"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#268BD3"
set -g @rain_accent_bright "#309BE8"
set -g @rain_on_accent "#001419"
set -g @rain_bg "#001419"
set -g @rain_panel "#002C38"
set -g @rain_raised "#002C38"
set -g @rain_border "#063540"
set -g @rain_text "#9EABAC"
set -g @rain_text_secondary "#839395"
set -g @rain_muted "#637981"
set -g @rain_link "#29A298"
set -g @rain_positive "#849900"
set -g @rain_warning "#B28500"
set -g @rain_danger "#F55350"
set -g @rain_comment "#576D74"
set -g @rain_palette "Solarized Osaka"
