# Rain Librekai Refined for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#211F1C,fg=#D8D8D3"
set -gq status-left-style "bg=#66D9EF,fg=#211F1C,bold"
set -gq status-right-style "bg=#383A3E,fg=#E8E8E3"
set -gq window-status-style "fg=#A1A29C"
set -gq window-status-current-style "bg=#272822,fg=#66D9EF,bold"
set -gq window-status-last-style "fg=#D8D8D3"
set -gq window-status-activity-style "fg=#FD9720"
set -gq window-status-bell-style "fg=#E73C50,bold"
set -gq pane-border-style "fg=#3F4145"
set -gq pane-active-border-style "fg=#66D9EF"
set -gq message-style "bg=#383A3E,fg=#E8E8E3"
set -gq message-command-style "bg=#383A3E,fg=#66D9EF"
set -gq mode-style "bg=#575B61,fg=#E8E8E3"
set -gq copy-mode-match-style "bg=#7D5421,fg=#E8E8E3"
set -gq copy-mode-current-match-style "bg=#FD9720,fg=#272822"
set -gq copy-mode-mark-style "bg=#5A7226,fg=#E8E8E3"
set -gq popup-style "bg=#383A3E,fg=#E8E8E3"
set -gq popup-border-style "fg=#66D9EF"
set -gq menu-style "bg=#383A3E,fg=#E8E8E3"
set -gq menu-selected-style "bg=#66D9EF,fg=#211F1C"
set -gq menu-border-style "fg=#3F4145"
set -gq display-panes-colour "#A1A29C"
set -gq display-panes-active-colour "#66D9EF"
set -gq clock-mode-colour "#66D9EF"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#66D9EF"
set -g @rain_accent_bright "#A1EFE4"
set -g @rain_on_accent "#211F1C"
set -g @rain_bg "#272822"
set -g @rain_panel "#211F1C"
set -g @rain_raised "#383A3E"
set -g @rain_border "#3F4145"
set -g @rain_text "#E8E8E3"
set -g @rain_text_secondary "#D8D8D3"
set -g @rain_muted "#A1A29C"
set -g @rain_link "#A6E22D"
set -g @rain_positive "#9EC400"
set -g @rain_warning "#FD9720"
set -g @rain_danger "#E73C50"
set -g @rain_comment "#75715E"
set -g @rain_palette "Librekai Refined"
