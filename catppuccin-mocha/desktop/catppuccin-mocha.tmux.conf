# Rain Catppuccin Mocha for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#181825,fg=#BAC2DE"
set -gq status-left-style "bg=#CBA6F7,fg=#1E1E2E,bold"
set -gq status-right-style "bg=#313244,fg=#CDD6F4"
set -gq window-status-style "fg=#7F849C"
set -gq window-status-current-style "bg=#1E1E2E,fg=#CBA6F7,bold"
set -gq window-status-last-style "fg=#BAC2DE"
set -gq window-status-activity-style "fg=#F9E2AF"
set -gq window-status-bell-style "fg=#F38BA8,bold"
set -gq pane-border-style "fg=#45475A"
set -gq pane-active-border-style "fg=#CBA6F7"
set -gq message-style "bg=#313244,fg=#CDD6F4"
set -gq message-command-style "bg=#313244,fg=#CBA6F7"
set -gq mode-style "bg=#585B70,fg=#CDD6F4"
set -gq copy-mode-match-style "bg=#766C62,fg=#CDD6F4"
set -gq copy-mode-current-match-style "bg=#F9E2AF,fg=#1E1E2E"
set -gq copy-mode-mark-style "bg=#495A80,fg=#CDD6F4"
set -gq popup-style "bg=#313244,fg=#CDD6F4"
set -gq popup-border-style "fg=#CBA6F7"
set -gq menu-style "bg=#313244,fg=#CDD6F4"
set -gq menu-selected-style "bg=#CBA6F7,fg=#1E1E2E"
set -gq menu-border-style "fg=#45475A"
set -gq display-panes-colour "#7F849C"
set -gq display-panes-active-colour "#CBA6F7"
set -gq clock-mode-colour "#CBA6F7"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#CBA6F7"
set -g @rain_accent_bright "#CCB4F6"
set -g @rain_on_accent "#1E1E2E"
set -g @rain_bg "#1E1E2E"
set -g @rain_panel "#181825"
set -g @rain_raised "#313244"
set -g @rain_border "#45475A"
set -g @rain_text "#CDD6F4"
set -g @rain_text_secondary "#BAC2DE"
set -g @rain_muted "#7F849C"
set -g @rain_link "#89B4FA"
set -g @rain_positive "#A6E3A1"
set -g @rain_warning "#F9E2AF"
set -g @rain_danger "#F38BA8"
set -g @rain_comment "#9399B2"
set -g @rain_palette "Catppuccin Mocha"
