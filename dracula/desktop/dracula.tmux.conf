# Rain Dracula for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#21222C,fg=#BCC2D3"
set -gq status-left-style "bg=#BD93F9,fg=#282A36,bold"
set -gq status-right-style "bg=#343746,fg=#F8F8F2"
set -gq window-status-style "fg=#6272A4"
set -gq window-status-current-style "bg=#282A36,fg=#BD93F9,bold"
set -gq window-status-last-style "fg=#BCC2D3"
set -gq window-status-activity-style "fg=#FFB86C"
set -gq window-status-bell-style "fg=#FF5555,bold"
set -gq pane-border-style "fg=#424450"
set -gq pane-active-border-style "fg=#BD93F9"
set -gq message-style "bg=#343746,fg=#F8F8F2"
set -gq message-command-style "bg=#343746,fg=#BD93F9"
set -gq mode-style "bg=#44475A,fg=#F8F8F2"
set -gq copy-mode-match-style "bg=#7E634C,fg=#F8F8F2"
set -gq copy-mode-current-match-style "bg=#FFB86C,fg=#282A36"
set -gq copy-mode-mark-style "bg=#507686,fg=#F8F8F2"
set -gq popup-style "bg=#343746,fg=#F8F8F2"
set -gq popup-border-style "fg=#BD93F9"
set -gq menu-style "bg=#343746,fg=#F8F8F2"
set -gq menu-selected-style "bg=#BD93F9,fg=#282A36"
set -gq menu-border-style "fg=#424450"
set -gq display-panes-colour "#6272A4"
set -gq display-panes-active-colour "#BD93F9"
set -gq clock-mode-colour "#BD93F9"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#BD93F9"
set -g @rain_accent_bright "#D6ACFF"
set -g @rain_on_accent "#282A36"
set -g @rain_bg "#282A36"
set -g @rain_panel "#21222C"
set -g @rain_raised "#343746"
set -g @rain_border "#424450"
set -g @rain_text "#F8F8F2"
set -g @rain_text_secondary "#BCC2D3"
set -g @rain_muted "#6272A4"
set -g @rain_link "#8BE9FD"
set -g @rain_positive "#50FA7B"
set -g @rain_warning "#FFB86C"
set -g @rain_danger "#FF5555"
set -g @rain_comment "#6272A4"
set -g @rain_palette "Dracula"
