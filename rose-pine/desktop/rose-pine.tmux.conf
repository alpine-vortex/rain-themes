# Rain Rosé Pine for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#1F1D2E,fg=#908CAA"
set -gq status-left-style "bg=#C4A7E7,fg=#191724,bold"
set -gq status-right-style "bg=#26233A,fg=#E0DEF4"
set -gq window-status-style "fg=#6E6A86"
set -gq window-status-current-style "bg=#191724,fg=#C4A7E7,bold"
set -gq window-status-last-style "fg=#908CAA"
set -gq window-status-activity-style "fg=#F6C177"
set -gq window-status-bell-style "fg=#EB6F92,bold"
set -gq pane-border-style "fg=#403D52"
set -gq pane-active-border-style "fg=#C4A7E7"
set -gq message-style "bg=#26233A,fg=#E0DEF4"
set -gq message-command-style "bg=#26233A,fg=#C4A7E7"
set -gq mode-style "bg=#403D52,fg=#E0DEF4"
set -gq copy-mode-match-style "bg=#715B45,fg=#E0DEF4"
set -gq copy-mode-current-match-style "bg=#F6C177,fg=#191724"
set -gq copy-mode-mark-style "bg=#4D616C,fg=#E0DEF4"
set -gq popup-style "bg=#26233A,fg=#E0DEF4"
set -gq popup-border-style "fg=#C4A7E7"
set -gq menu-style "bg=#26233A,fg=#E0DEF4"
set -gq menu-selected-style "bg=#C4A7E7,fg=#191724"
set -gq menu-border-style "fg=#403D52"
set -gq display-panes-colour "#6E6A86"
set -gq display-panes-active-colour "#C4A7E7"
set -gq clock-mode-colour "#C4A7E7"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#C4A7E7"
set -g @rain_accent_bright "#CFBDEC"
set -g @rain_on_accent "#191724"
set -g @rain_bg "#191724"
set -g @rain_panel "#1F1D2E"
set -g @rain_raised "#26233A"
set -g @rain_border "#403D52"
set -g @rain_text "#E0DEF4"
set -g @rain_text_secondary "#908CAA"
set -g @rain_muted "#6E6A86"
set -g @rain_link "#9CCFD8"
set -g @rain_positive "#31748F"
set -g @rain_warning "#F6C177"
set -g @rain_danger "#EB6F92"
set -g @rain_comment "#908CAA"
set -g @rain_palette "Rosé Pine"
