# Rain Gruvbox Material Dark for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#32302F,fg=#A89984"
set -gq status-left-style "bg=#7DAEA3,fg=#282828,bold"
set -gq status-right-style "bg=#45403D,fg=#D4BE98"
set -gq window-status-style "fg=#928374"
set -gq window-status-current-style "bg=#282828,fg=#7DAEA3,bold"
set -gq window-status-last-style "fg=#A89984"
set -gq window-status-activity-style "fg=#D8A657"
set -gq window-status-bell-style "fg=#EA6962,bold"
set -gq pane-border-style "fg=#504945"
set -gq pane-active-border-style "fg=#7DAEA3"
set -gq message-style "bg=#45403D,fg=#D4BE98"
set -gq message-command-style "bg=#45403D,fg=#7DAEA3"
set -gq mode-style "bg=#45403D,fg=#D4BE98"
set -gq copy-mode-match-style "bg=#6E5A3B,fg=#D4BE98"
set -gq copy-mode-current-match-style "bg=#D8A657,fg=#282828"
set -gq copy-mode-mark-style "bg=#6C4E56,fg=#D4BE98"
set -gq popup-style "bg=#45403D,fg=#D4BE98"
set -gq popup-border-style "fg=#7DAEA3"
set -gq menu-style "bg=#45403D,fg=#D4BE98"
set -gq menu-selected-style "bg=#7DAEA3,fg=#282828"
set -gq menu-border-style "fg=#504945"
set -gq display-panes-colour "#928374"
set -gq display-panes-active-colour "#7DAEA3"
set -gq clock-mode-colour "#7DAEA3"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#7DAEA3"
set -g @rain_accent_bright "#9FB7A2"
set -g @rain_on_accent "#282828"
set -g @rain_bg "#282828"
set -g @rain_panel "#32302F"
set -g @rain_raised "#45403D"
set -g @rain_border "#504945"
set -g @rain_text "#D4BE98"
set -g @rain_text_secondary "#A89984"
set -g @rain_muted "#928374"
set -g @rain_link "#D3869B"
set -g @rain_positive "#A9B665"
set -g @rain_warning "#D8A657"
set -g @rain_danger "#EA6962"
set -g @rain_comment "#928374"
set -g @rain_palette "Gruvbox Material Dark"
