# Rain Librekai for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#1E1F1C,fg=#CCCCC7"
set -gq status-left-style "bg=#F93B7F,fg=#1E1F1C,bold"
set -gq status-right-style "bg=#3E3D32,fg=#F8F8F2"
set -gq window-status-style "fg=#90908A"
set -gq window-status-current-style "bg=#272822,fg=#F93B7F,bold"
set -gq window-status-last-style "fg=#CCCCC7"
set -gq window-status-activity-style "fg=#FD971F"
set -gq window-status-bell-style "fg=#F44747,bold"
set -gq pane-border-style "fg=#464741"
set -gq pane-active-border-style "fg=#F93B7F"
set -gq message-style "bg=#3E3D32,fg=#F8F8F2"
set -gq message-command-style "bg=#3E3D32,fg=#F93B7F"
set -gq mode-style "bg=#75715E,fg=#F8F8F2"
set -gq copy-mode-match-style "bg=#7D5421,fg=#F8F8F2"
set -gq copy-mode-current-match-style "bg=#FD971F,fg=#272822"
set -gq copy-mode-mark-style "bg=#406F74,fg=#F8F8F2"
set -gq popup-style "bg=#3E3D32,fg=#F8F8F2"
set -gq popup-border-style "fg=#F93B7F"
set -gq menu-style "bg=#3E3D32,fg=#F8F8F2"
set -gq menu-selected-style "bg=#F93B7F,fg=#1E1F1C"
set -gq menu-border-style "fg=#464741"
set -gq display-panes-colour "#90908A"
set -gq display-panes-active-colour "#F93B7F"
set -gq clock-mode-colour "#F93B7F"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#F93B7F"
set -g @rain_accent_bright "#F9709F"
set -g @rain_on_accent "#1E1F1C"
set -g @rain_bg "#272822"
set -g @rain_panel "#1E1F1C"
set -g @rain_raised "#3E3D32"
set -g @rain_border "#464741"
set -g @rain_text "#F8F8F2"
set -g @rain_text_secondary "#CCCCC7"
set -g @rain_muted "#90908A"
set -g @rain_link "#66D9EF"
set -g @rain_positive "#A6E22E"
set -g @rain_warning "#FD971F"
set -g @rain_danger "#F44747"
set -g @rain_comment "#88846F"
set -g @rain_palette "Librekai"
