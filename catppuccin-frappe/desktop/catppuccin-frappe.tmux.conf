# Rain Catppuccin Frappé for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#292C3C,fg=#B5BFE2"
set -gq status-left-style "bg=#CA9EE6,fg=#303446,bold"
set -gq status-right-style "bg=#414559,fg=#C6D0F5"
set -gq window-status-style "fg=#838BA7"
set -gq window-status-current-style "bg=#303446,fg=#CA9EE6,bold"
set -gq window-status-last-style "fg=#B5BFE2"
set -gq window-status-activity-style "fg=#E5C890"
set -gq window-status-bell-style "fg=#E78284,bold"
set -gq pane-border-style "fg=#51576D"
set -gq pane-active-border-style "fg=#CA9EE6"
set -gq message-style "bg=#414559,fg=#C6D0F5"
set -gq message-command-style "bg=#414559,fg=#CA9EE6"
set -gq mode-style "bg=#626880,fg=#C6D0F5"
set -gq copy-mode-match-style "bg=#786F64,fg=#C6D0F5"
set -gq copy-mode-current-match-style "bg=#E5C890,fg=#303446"
set -gq copy-mode-mark-style "bg=#556389,fg=#C6D0F5"
set -gq popup-style "bg=#414559,fg=#C6D0F5"
set -gq popup-border-style "fg=#CA9EE6"
set -gq menu-style "bg=#414559,fg=#C6D0F5"
set -gq menu-selected-style "bg=#CA9EE6,fg=#303446"
set -gq menu-border-style "fg=#51576D"
set -gq display-panes-colour "#838BA7"
set -gq display-panes-active-colour "#CA9EE6"
set -gq clock-mode-colour "#CA9EE6"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#CA9EE6"
set -g @rain_accent_bright "#C9ADEA"
set -g @rain_on_accent "#303446"
set -g @rain_bg "#303446"
set -g @rain_panel "#292C3C"
set -g @rain_raised "#414559"
set -g @rain_border "#51576D"
set -g @rain_text "#C6D0F5"
set -g @rain_text_secondary "#B5BFE2"
set -g @rain_muted "#838BA7"
set -g @rain_link "#8CAAEE"
set -g @rain_positive "#A6D189"
set -g @rain_warning "#E5C890"
set -g @rain_danger "#E78284"
set -g @rain_comment "#949CBB"
set -g @rain_palette "Catppuccin Frappé"
