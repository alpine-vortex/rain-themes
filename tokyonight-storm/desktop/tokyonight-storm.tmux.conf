# Rain Tokyo Night Storm for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#1F2335,fg=#A9B1D6"
set -gq status-left-style "bg=#7AA2F7,fg=#1D202F,bold"
set -gq status-right-style "bg=#292E42,fg=#C0CAF5"
set -gq window-status-style "fg=#737AA2"
set -gq window-status-current-style "bg=#24283B,fg=#7AA2F7,bold"
set -gq window-status-last-style "fg=#A9B1D6"
set -gq window-status-activity-style "fg=#E0AF68"
set -gq window-status-bell-style "fg=#DB4B4B,bold"
set -gq pane-border-style "fg=#3B4261"
set -gq pane-active-border-style "fg=#7AA2F7"
set -gq message-style "bg=#292E42,fg=#C0CAF5"
set -gq message-command-style "bg=#292E42,fg=#7AA2F7"
set -gq mode-style "bg=#2E3C64,fg=#C0CAF5"
set -gq copy-mode-match-style "bg=#6F5E4D,fg=#C0CAF5"
set -gq copy-mode-current-match-style "bg=#E0AF68,fg=#24283B"
set -gq copy-mode-mark-style "bg=#206362,fg=#C0CAF5"
set -gq popup-style "bg=#292E42,fg=#C0CAF5"
set -gq popup-border-style "fg=#7AA2F7"
set -gq menu-style "bg=#292E42,fg=#C0CAF5"
set -gq menu-selected-style "bg=#7AA2F7,fg=#1D202F"
set -gq menu-border-style "fg=#3B4261"
set -gq display-panes-colour "#737AA2"
set -gq display-panes-active-colour "#7AA2F7"
set -gq clock-mode-colour "#7AA2F7"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#7AA2F7"
set -g @rain_accent_bright "#8DB0FF"
set -g @rain_on_accent "#1D202F"
set -g @rain_bg "#24283B"
set -g @rain_panel "#1F2335"
set -g @rain_raised "#292E42"
set -g @rain_border "#3B4261"
set -g @rain_text "#C0CAF5"
set -g @rain_text_secondary "#A9B1D6"
set -g @rain_muted "#737AA2"
set -g @rain_link "#1ABC9C"
set -g @rain_positive "#9ECE6A"
set -g @rain_warning "#E0AF68"
set -g @rain_danger "#DB4B4B"
set -g @rain_comment "#565F89"
set -g @rain_palette "Tokyo Night Storm"
