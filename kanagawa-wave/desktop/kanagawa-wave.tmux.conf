# Rain Kanagawa Wave for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#181820,fg=#C8C093"
set -gq status-left-style "bg=#7E9CD8,fg=#16161D,bold"
set -gq status-right-style "bg=#2A2A37,fg=#DCD7BA"
set -gq window-status-style "fg=#727169"
set -gq window-status-current-style "bg=#1F1F28,fg=#7E9CD8,bold"
set -gq window-status-last-style "fg=#C8C093"
set -gq window-status-activity-style "fg=#FF9E3B"
set -gq window-status-bell-style "fg=#E82424,bold"
set -gq pane-border-style "fg=#363646"
set -gq pane-active-border-style "fg=#7E9CD8"
set -gq message-style "bg=#2A2A37,fg=#DCD7BA"
set -gq message-command-style "bg=#2A2A37,fg=#7E9CD8"
set -gq mode-style "bg=#2D4F67,fg=#DCD7BA"
set -gq copy-mode-match-style "bg=#795230,fg=#DCD7BA"
set -gq copy-mode-current-match-style "bg=#FF9E3B,fg=#1F1F28"
set -gq copy-mode-mark-style "bg=#455B69,fg=#DCD7BA"
set -gq popup-style "bg=#2A2A37,fg=#DCD7BA"
set -gq popup-border-style "fg=#7E9CD8"
set -gq menu-style "bg=#2A2A37,fg=#DCD7BA"
set -gq menu-selected-style "bg=#7E9CD8,fg=#16161D"
set -gq menu-border-style "fg=#363646"
set -gq display-panes-colour "#727169"
set -gq display-panes-active-colour "#7E9CD8"
set -gq clock-mode-colour "#7E9CD8"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#7E9CD8"
set -g @rain_accent_bright "#9CABCA"
set -g @rain_on_accent "#16161D"
set -g @rain_bg "#1F1F28"
set -g @rain_panel "#181820"
set -g @rain_raised "#2A2A37"
set -g @rain_border "#363646"
set -g @rain_text "#DCD7BA"
set -g @rain_text_secondary "#C8C093"
set -g @rain_muted "#727169"
set -g @rain_link "#7FB4CA"
set -g @rain_positive "#98BB6C"
set -g @rain_warning "#FF9E3B"
set -g @rain_danger "#E82424"
set -g @rain_comment "#727169"
set -g @rain_palette "Kanagawa Wave"
