# Rain Catppuccin Macchiato for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#1E2030,fg=#B8C0E0"
set -gq status-left-style "bg=#C6A0F6,fg=#24273A,bold"
set -gq status-right-style "bg=#363A4F,fg=#CAD3F5"
set -gq window-status-style "fg=#8087A2"
set -gq window-status-current-style "bg=#24273A,fg=#C6A0F6,bold"
set -gq window-status-last-style "fg=#B8C0E0"
set -gq window-status-activity-style "fg=#EED49F"
set -gq window-status-bell-style "fg=#ED8796,bold"
set -gq pane-border-style "fg=#494D64"
set -gq pane-active-border-style "fg=#C6A0F6"
set -gq message-style "bg=#363A4F,fg=#CAD3F5"
set -gq message-command-style "bg=#363A4F,fg=#C6A0F6"
set -gq mode-style "bg=#5B6078,fg=#CAD3F5"
set -gq copy-mode-match-style "bg=#756C62,fg=#CAD3F5"
set -gq copy-mode-current-match-style "bg=#EED49F,fg=#24273A"
set -gq copy-mode-mark-style "bg=#4D5D84,fg=#CAD3F5"
set -gq popup-style "bg=#363A4F,fg=#CAD3F5"
set -gq popup-border-style "fg=#C6A0F6"
set -gq menu-style "bg=#363A4F,fg=#CAD3F5"
set -gq menu-selected-style "bg=#C6A0F6,fg=#24273A"
set -gq menu-border-style "fg=#494D64"
set -gq display-panes-colour "#8087A2"
set -gq display-panes-active-colour "#C6A0F6"
set -gq clock-mode-colour "#C6A0F6"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#C6A0F6"
set -g @rain_accent_bright "#C7AFF6"
set -g @rain_on_accent "#24273A"
set -g @rain_bg "#24273A"
set -g @rain_panel "#1E2030"
set -g @rain_raised "#363A4F"
set -g @rain_border "#494D64"
set -g @rain_text "#CAD3F5"
set -g @rain_text_secondary "#B8C0E0"
set -g @rain_muted "#8087A2"
set -g @rain_link "#8AADF4"
set -g @rain_positive "#A6DA95"
set -g @rain_warning "#EED49F"
set -g @rain_danger "#ED8796"
set -g @rain_comment "#939AB7"
set -g @rain_palette "Catppuccin Macchiato"
