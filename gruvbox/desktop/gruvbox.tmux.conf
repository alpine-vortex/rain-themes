# Rain Gruvbox for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#32302F,fg=#BDAE93"
set -gq status-left-style "bg=#FE8019,fg=#282828,bold"
set -gq status-right-style "bg=#3C3836,fg=#EBDBB2"
set -gq window-status-style "fg=#928374"
set -gq window-status-current-style "bg=#282828,fg=#FE8019,bold"
set -gq window-status-last-style "fg=#BDAE93"
set -gq window-status-activity-style "fg=#FABD2F"
set -gq window-status-bell-style "fg=#FB4934,bold"
set -gq pane-border-style "fg=#504945"
set -gq pane-active-border-style "fg=#FE8019"
set -gq message-style "bg=#3C3836,fg=#EBDBB2"
set -gq message-command-style "bg=#3C3836,fg=#FE8019"
set -gq mode-style "bg=#665C54,fg=#EBDBB2"
set -gq copy-mode-match-style "bg=#7C642B,fg=#EBDBB2"
set -gq copy-mode-current-match-style "bg=#FABD2F,fg=#282828"
set -gq copy-mode-mark-style "bg=#4C5A55,fg=#EBDBB2"
set -gq popup-style "bg=#3C3836,fg=#EBDBB2"
set -gq popup-border-style "fg=#FE8019"
set -gq menu-style "bg=#3C3836,fg=#EBDBB2"
set -gq menu-selected-style "bg=#FE8019,fg=#282828"
set -gq menu-border-style "fg=#504945"
set -gq display-panes-colour "#928374"
set -gq display-panes-active-colour "#FE8019"
set -gq clock-mode-colour "#FE8019"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#FE8019"
set -g @rain_accent_bright "#FDA653"
set -g @rain_on_accent "#282828"
set -g @rain_bg "#282828"
set -g @rain_panel "#32302F"
set -g @rain_raised "#3C3836"
set -g @rain_border "#504945"
set -g @rain_text "#EBDBB2"
set -g @rain_text_secondary "#BDAE93"
set -g @rain_muted "#928374"
set -g @rain_link "#83A598"
set -g @rain_positive "#B8BB26"
set -g @rain_warning "#FABD2F"
set -g @rain_danger "#FB4934"
set -g @rain_comment "#928374"
set -g @rain_palette "Gruvbox"
