# Rain Tokyo Night Moon for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#1E2030,fg=#828BB8"
set -gq status-left-style "bg=#82AAFF,fg=#1B1D2B,bold"
set -gq status-right-style "bg=#2F334D,fg=#C8D3F5"
set -gq window-status-style "fg=#737AA2"
set -gq window-status-current-style "bg=#222436,fg=#82AAFF,bold"
set -gq window-status-last-style "fg=#828BB8"
set -gq window-status-activity-style "fg=#FFC777"
set -gq window-status-bell-style "fg=#FF757F,bold"
set -gq pane-border-style "fg=#3B4261"
set -gq pane-active-border-style "fg=#82AAFF"
set -gq message-style "bg=#2F334D,fg=#C8D3F5"
set -gq message-command-style "bg=#2F334D,fg=#82AAFF"
set -gq mode-style "bg=#2D3F76,fg=#C8D3F5"
set -gq copy-mode-match-style "bg=#7A6550,fg=#C8D3F5"
set -gq copy-mode-current-match-style "bg=#FFC777,fg=#222436"
set -gq copy-mode-mark-style "bg=#346B6C,fg=#C8D3F5"
set -gq popup-style "bg=#2F334D,fg=#C8D3F5"
set -gq popup-border-style "fg=#82AAFF"
set -gq menu-style "bg=#2F334D,fg=#C8D3F5"
set -gq menu-selected-style "bg=#82AAFF,fg=#1B1D2B"
set -gq menu-border-style "fg=#3B4261"
set -gq display-panes-colour "#737AA2"
set -gq display-panes-active-colour "#82AAFF"
set -gq clock-mode-colour "#82AAFF"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#82AAFF"
set -g @rain_accent_bright "#9AB8FF"
set -g @rain_on_accent "#1B1D2B"
set -g @rain_bg "#222436"
set -g @rain_panel "#1E2030"
set -g @rain_raised "#2F334D"
set -g @rain_border "#3B4261"
set -g @rain_text "#C8D3F5"
set -g @rain_text_secondary "#828BB8"
set -g @rain_muted "#737AA2"
set -g @rain_link "#4FD6BE"
set -g @rain_positive "#C3E88D"
set -g @rain_warning "#FFC777"
set -g @rain_danger "#FF757F"
set -g @rain_comment "#636DA6"
set -g @rain_palette "Tokyo Night Moon"
