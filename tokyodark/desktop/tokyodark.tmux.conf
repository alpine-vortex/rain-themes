# Rain Tokyo Dark for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#1A1B2A,fg=#8A92B0"
set -gq status-left-style "bg=#7199EE,fg=#11121D,bold"
set -gq status-right-style "bg=#212234,fg=#A0A8CD"
set -gq window-status-style "fg=#757C92"
set -gq window-status-current-style "bg=#11121D,fg=#7199EE,bold"
set -gq window-status-last-style "fg=#8A92B0"
set -gq window-status-activity-style "fg=#D7A65F"
set -gq window-status-bell-style "fg=#EE6D85,bold"
set -gq pane-border-style "fg=#353945"
set -gq pane-active-border-style "fg=#7199EE"
set -gq message-style "bg=#212234,fg=#A0A8CD"
set -gq message-command-style "bg=#212234,fg=#7199EE"
set -gq mode-style "bg=#212234,fg=#A0A8CD"
set -gq copy-mode-match-style "bg=#604D37,fg=#A0A8CD"
set -gq copy-mode-current-match-style "bg=#D7A65F,fg=#11121D"
set -gq copy-mode-mark-style "bg=#4C406A,fg=#A0A8CD"
set -gq popup-style "bg=#212234,fg=#A0A8CD"
set -gq popup-border-style "fg=#7199EE"
set -gq menu-style "bg=#212234,fg=#A0A8CD"
set -gq menu-selected-style "bg=#7199EE,fg=#11121D"
set -gq menu-border-style "fg=#353945"
set -gq display-panes-colour "#757C92"
set -gq display-panes-active-colour "#7199EE"
set -gq clock-mode-colour "#7199EE"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#7199EE"
set -g @rain_accent_bright "#9FBBF3"
set -g @rain_on_accent "#11121D"
set -g @rain_bg "#11121D"
set -g @rain_panel "#1A1B2A"
set -g @rain_raised "#212234"
set -g @rain_border "#353945"
set -g @rain_text "#A0A8CD"
set -g @rain_text_secondary "#8A92B0"
set -g @rain_muted "#757C92"
set -g @rain_link "#A485DD"
set -g @rain_positive "#95C561"
set -g @rain_warning "#D7A65F"
set -g @rain_danger "#EE6D85"
set -g @rain_comment "#4A5057"
set -g @rain_palette "Tokyo Dark"
