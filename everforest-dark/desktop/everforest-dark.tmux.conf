# Rain Everforest Dark for tmux. Generated by tools/desktop_export.py; do not edit.
# Colours only: status-left/right and window formats stay yours. Load it from tmux.conf with
#   source-file -q ~/.config/tmux/rain.conf
# Exact colours need a truecolor terminal and tmux told so, e.g.
#   set -as terminal-features ',xterm-256color:RGB'
# -q: options a tmux older than 3.4 lacks are skipped quietly.

set -gq status-style "bg=#343F44,fg=#AAB0A2"
set -gq status-left-style "bg=#A7C080,fg=#2D353B,bold"
set -gq status-right-style "bg=#3D484D,fg=#D3C6AA"
set -gq window-status-style "fg=#859289"
set -gq window-status-current-style "bg=#2D353B,fg=#A7C080,bold"
set -gq window-status-last-style "fg=#AAB0A2"
set -gq window-status-activity-style "fg=#DBBC7F"
set -gq window-status-bell-style "fg=#E67E80,bold"
set -gq pane-border-style "fg=#475258"
set -gq pane-active-border-style "fg=#A7C080"
set -gq message-style "bg=#3D484D,fg=#D3C6AA"
set -gq message-command-style "bg=#3D484D,fg=#A7C080"
set -gq mode-style "bg=#543A48,fg=#D3C6AA"
set -gq copy-mode-match-style "bg=#736B56,fg=#D3C6AA"
set -gq copy-mode-current-match-style "bg=#DBBC7F,fg=#2D353B"
set -gq copy-mode-mark-style "bg=#4E6B6B,fg=#D3C6AA"
set -gq popup-style "bg=#3D484D,fg=#D3C6AA"
set -gq popup-border-style "fg=#A7C080"
set -gq menu-style "bg=#3D484D,fg=#D3C6AA"
set -gq menu-selected-style "bg=#A7C080,fg=#2D353B"
set -gq menu-border-style "fg=#475258"
set -gq display-panes-colour "#859289"
set -gq display-panes-active-colour "#A7C080"
set -gq clock-mode-colour "#A7C080"

# for your own formats: #[fg=#{@rain_accent}]
set -g @rain_accent "#A7C080"
set -g @rain_accent_bright "#B6C28F"
set -g @rain_on_accent "#2D353B"
set -g @rain_bg "#2D353B"
set -g @rain_panel "#343F44"
set -g @rain_raised "#3D484D"
set -g @rain_border "#475258"
set -g @rain_text "#D3C6AA"
set -g @rain_text_secondary "#AAB0A2"
set -g @rain_muted "#859289"
set -g @rain_link "#7FBBB3"
set -g @rain_positive "#83C092"
set -g @rain_warning "#DBBC7F"
set -g @rain_danger "#E67E80"
set -g @rain_comment "#859289"
set -g @rain_palette "Everforest Dark"
